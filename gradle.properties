# Lumance build configuration
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft version to patch. Resolved through Mojang's version manifest.
mcVersion=26.3
versionManifestUrl=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Optional: pin exact artifacts and skip manifest lookup entirely.
# vanillaBundleUrl=
# vanillaBundleSha1=

# JDK used to compile the patched server (Minecraft 26.x needs 25).
javaVersion=25

# Build-time tools (Maven Central, except the Vineflower plugin).
# Decompiler is pinned to what NeoForm uses for this version.
# The NeoForm artifact itself (decompile fixup patches) is fetched by the build.
vineflowerVersion=1.12.0
vineflowerPluginsVersion=0.1.6
neoformVersion=26.3-1
# Fabric Loader stack for running Fabric mods (resolved at build, downloaded at runtime).
# Loader + API versions match the official fabric-example-mod for this game version.
fabricLoaderVersion=0.19.5
fabricAsmVersion=9.10.1
fabricMixinVersion=0.17.4+mixin.0.8.7
# Fabric API ships built in (loaded as a mod, never on the game classpath).
fabricApiVersion=0.161.0+26.3
gsonVersion=2.14.0
# Bukkit/CraftBukkit/Spigot compile deps (vendored sources under src/lumance/java
# reference these; vanilla work/cache/libs does NOT ship them).
# bungeecord-chat provides net.md_5.bungee.api.chat.* (Spigot chat API).
# Latest Central release is 1.21-R0.4; snapshots for newer MC come from the
# Spigot snapshots repo in settings.gradle.
bungeecordChatVersion=1.21-R0.4
  # Adventure is the component model behind the Paper-typed Bukkit API methods we restore
  # (Player#sendActionBar(Component)). Compile-time only; plugins bring it at runtime.
  adventureVersion=4.14.0
  # Caffeine replaces Guava's LoadingCache for the internal-only caches in net.minecraft. Those
  # fields are private, so no plugin or mod ever sees the type: it is bundled, not compile-only.
  caffeineVersion=3.2.1
bungeecordSerializerVersion=1.21-R0.4
snakeyamlVersion=2.3
commonsLangVersion=2.6
jlineVersion=3.27.1
# Log4j2 appender that drives the JLine terminal console (used by the CraftBukkit
# console logging path). Its transitive deps are excluded: log4j ships in the
# vanilla bundle and the jline modules are pinned by jlineVersion above.
terminalConsoleAppenderVersion=1.3.0
# ASM for CraftBukkit bytecode tools (Commodore, Reroute) — same version as Fabric stack.
# Maven resolver (Eclipse Aether) for Bukkit LibraryLoader (plugin library downloading).
aetherVersion=1.1.0
mavenAetherProviderVersion=3.3.9

# Version stamped into the bootstrap jar and the patched server.
lumanceVersion=0.1.0
