# Lumance - Maven descriptor for the bundled spigot-api.
#
# CraftBukkit's Versioning.getBukkitVersion() reads this file to answer
# Bukkit.getBukkitVersion(). Without it every plugin that version-gates on that
# call sees "Unknown-Version" and takes its legacy code path (for example
# AuraSkills looks up the pre-1.21.2 "generic.max_health" attribute key, which no
# longer exists, and dies in a static initialiser).
#
# ${MC_VERSION} is substituted by processServerResources in build.gradle.
version=${MC_VERSION}-R0.1-SNAPSHOT
groupId=org.spigotmc
artifactId=spigot-api